name: Translation contribution
description: Send translations, correct wording, or offer to review a language. No coding needed.
title: "Translation: "
body:
  - type: markdown
    attributes:
      value: |
        A few phrases are welcome! Bloom uses English for anything not translated yet.
        You can send words here instead of editing code. See [the translation guide](https://github.com/SehajveerSingh2005/bloom/blob/main/TRANSLATING.md).
  - type: input
    id: language
    attributes:
      label: Language
      description: Include the region when relevant, such as Brazilian or European Portuguese.
      placeholder: French, Spanish, Brazilian Portuguese…
    validations:
      required: true
  - type: textarea
    id: translations
    attributes:
      label: Translations or corrections
      description: Give the English phrase, your translation, and where it appears. Keep placeholders such as {count} unchanged.
      placeholder: |
        Screen: Settings
        English: Cancel
        Translation: Annuler
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context or review help
      description: Optional terminology notes, screenshots, or an offer to review this language.
